[package]
name = "gdb-gui"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3

lto = "fat"

codegen-units = 1

panic = "abort"

strip = true

[dependencies]
egui = "0.33.3"
eframe = "0.33.3"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
